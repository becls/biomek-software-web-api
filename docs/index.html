    <style>
        html,

            margin: 0;
            padding: 0;

        /* Custom header hosting the Beckman Coulter Life Sciences logo. */
        :root {
            --scalar-custom-header-height: 64px;
        }

        .custom-header {
            height: var(--scalar-custom-header-height);
            background-color: var(--scalar-background-2);
            border-bottom: var(--scalar-border-width) solid var(--scalar-border-color);
            padding: 0 18px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
        }

        .custom-header svg {
            height: 32px;
            width: auto;
        }

        /*
         * The Beckman logo wordmark uses a near-black fill (.st1). In Scalar's
         * dark mode, flip that fill to white for legibility while leaving the
         * red brand mark (.st0) untouched. Scalar toggles the .dark-mode class
         * on the document root, so the sticky header can react to it.
         */
        .dark-mode .custom-header svg .st1 {
            fill: #fff;
        }
    </style>
</head>
